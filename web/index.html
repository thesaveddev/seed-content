<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Seed — Turn One Piece of Content Into a Full Content Campaign</title>
    <meta name="description" content="Seed turns one video, podcast, or post into platform-ready content for LinkedIn, X, Instagram, TikTok, YouTube, newsletters and blogs — in minutes. Create once. Repurpose everywhere." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Seed" />
    <!-- Update SITE_URL when your production domain is live, then regenerate sitemap refs -->
    <link rel="canonical" href="/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seed" />
    <meta property="og:title" content="Seed — Turn One Piece of Content Into a Full Content Campaign" />
    <meta property="og:description" content="Turn a video, podcast, post or idea into platform-ready content for your entire audience — in minutes." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Seed — create once, repurpose everywhere" />
    <meta property="og:url" content="/" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seed — Turn One Piece of Content Into a Full Content Campaign" />
    <meta name="twitter:description" content="Turn a video, podcast, post or idea into platform-ready content for your entire audience — in minutes." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme colour matches the light-mode paper token -->
    <meta name="theme-color" content="#f5f4fc" />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Seed",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI content repurposing tool that turns one piece of content into platform-ready content for LinkedIn, X, Instagram, TikTok, YouTube, newsletters and blogs.",
      "offers": [
        { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
        { "@type": "Offer", "name": "Creator", "price": "9", "priceCurrency": "USD" },
        { "@type": "Offer", "name": "Pro", "price": "19", "priceCurrency": "USD" },
        { "@type": "Offer", "name": "Agency", "price": "59", "priceCurrency": "USD" }
      ]
    }
    </script>
  </head>
  <body>
    <script>
      (function() {
        var t = localStorage.getItem('seed-theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
